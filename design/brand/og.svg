<?xml version="1.0" encoding="UTF-8"?>
<!-- Turnout OG / social preview, 1200 x 630. Wordmark and headline reference Fraunces and Inter by family name; rasterise with both fonts installed. -->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EE"/>
  <!-- lockup, 40 px wordmark -->
  <svg x="76.3" y="84.4" width="39" height="39" viewBox="0 0 32 32" overflow="visible">
    <path d="M12.5 13V4H27.5V28H3" fill="none" stroke="#17150F" stroke-width="2.4" stroke-linejoin="miter" stroke-linecap="butt"/>
    <circle cx="4.8" cy="25.2" r="1.6" fill="#17150F"/>
    <circle cx="12" cy="24.5" r="2.3" fill="#17150F"/>
    <circle cx="20.8" cy="23.6" r="3.2" fill="#B4530A"/>
  </svg>
  <text x="125.4" y="120" font-family="Fraunces, Iowan Old Style, Georgia, serif" font-weight="500" font-size="40" letter-spacing="-0.8" fill="#17150F" style="font-variation-settings:'opsz' 144">Turnout</text>
  <text x="126.4" y="141" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="1.68" fill="#6B655B">CROWD TO CAMPAIGN</text>
  <!-- headline -->
  <text font-family="Fraunces, Iowan Old Style, Georgia, serif" font-weight="500" font-size="76" letter-spacing="-1.9" fill="#17150F" style="font-variation-settings:'opsz' 144">
    <tspan x="80" y="356">Turn the crowd outside</tspan>
    <tspan x="80" y="440">into customers <tspan font-style="italic" fill="#B4530A">inside</tspan>.</tspan>
  </text>
  <text x="82" y="520" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="22" fill="#6B655B">An agent for bars, restaurants and shops near venues. It sees the crowd coming,</text>
  <text x="82" y="552" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="22" fill="#6B655B">learns what they love, and writes the offer. You approve.</text>
  <!-- large mark, right -->
  <svg x="872" y="96" width="256" height="256" viewBox="0 0 32 32" overflow="visible">
    <path d="M12.5 13V4H27.5V28H3" fill="none" stroke="#17150F" stroke-width="2.4" stroke-linejoin="miter" stroke-linecap="butt"/>
    <circle cx="4.8" cy="25.2" r="1.6" fill="#17150F"/>
    <circle cx="12" cy="24.5" r="2.3" fill="#17150F"/>
    <circle cx="20.8" cy="23.6" r="3.2" fill="#B4530A"/>
  </svg>
  <path d="M80 590H1120" stroke="#E4DED3" stroke-width="1"/>
  <text x="80" y="612" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="1.54" fill="#6B655B">TURNOUT.APP</text>
</svg>
