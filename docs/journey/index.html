<meta charset="utf-8">
<title>Turnout merchant journey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Header (brand, views, language) / three panes: journey rail, live product screen in a device frame, "under the hood" panel. Turnout brand tokens; the product screens keep the product's own light look in both themes. */
:root{
  --paper:#f7f4ee;--panel:#fffdf9;--ink:#17150f;--text:#2a2721;--muted:#6b655b;--line:#e4ded3;--line-strong:#cfc7b8;
  --accent:#b4530a;--accent-text:#a54a07;--accent-soft:#fbe9d9;
  --push:#0f6e56;--push-soft:#e1f5ee;
  --done:#1f7a4d;--done-soft:#e3f3ea;--wip:#805300;--wip-soft:#fff3d6;--todo:#5f5a51;--todo-soft:#ece7dd;
  --qloo:#534ab7;--qloo-soft:#eeedfe;--stage:#ebe6dc;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* product screen palette: fixed, the product is light */
  --s-paper:#f7f4ee;--s-panel:#ffffff;--s-panel2:#fbf9f5;--s-ink:#17150f;--s-text:#2a2721;--s-muted:#6b655b;--s-line:#e4ded3;--s-line2:#cfc7b8;
  --s-accent:#b4530a;--s-accent-soft:#fbe9d9;--s-ok:#1f7a4d;--s-ok-soft:#e3f3ea;--s-warn:#805300;--s-warn-soft:#fff3d6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15130f;--panel:#1d1b16;--ink:#f3efe7;--text:#e3ddd2;--muted:#a59e91;--line:#353128;--line-strong:#4a453a;
  --accent:#e08a45;--accent-text:#f0a467;--accent-soft:#3a2615;
  --push:#5dcaa5;--push-soft:#0e2f27;
  --done:#6fcf97;--done-soft:#143022;--wip:#f0c25a;--wip-soft:#3a2d0e;--todo:#b9b2a5;--todo-soft:#2a2720;
  --qloo:#b8b2f0;--qloo-soft:#26214a;--stage:#100e0b;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15130f;--panel:#1d1b16;--ink:#f3efe7;--text:#e3ddd2;--muted:#a59e91;--line:#353128;--line-strong:#4a453a;
  --accent:#e08a45;--accent-text:#f0a467;--accent-soft:#3a2615;
  --push:#5dcaa5;--push-soft:#0e2f27;
  --done:#6fcf97;--done-soft:#143022;--wip:#f0c25a;--wip-soft:#3a2d0e;--todo:#b9b2a5;--todo-soft:#2a2720;
  --qloo:#b8b2f0;--qloo-soft:#26214a;--stage:#100e0b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:14.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;color:var(--ink);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:12px}
.app{max-width:1320px;margin:0 auto;display:grid;gap:18px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-weight:500;font-size:22px;color:var(--ink);letter-spacing:-.02em}
.brand span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;gap:2px;background:var(--panel)}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.intro{display:grid;gap:6px;max-width:80ch}
.intro h1{font-size:clamp(24px,3.4vw,34px);line-height:1.1}
.intro p{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;gap:6px;align-items:center}

/* chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.done{background:var(--done-soft);color:var(--done)}
.wip{background:var(--wip-soft);color:var(--wip)}
.todo{background:var(--todo-soft);color:var(--todo)}
.trig{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.trig.pull{border:1px solid var(--line-strong);color:var(--muted)}
.trig.push{background:var(--push-soft);color:var(--push)}
.svc{font-size:11px;font-weight:600;text-align:center;padding:2px 6px;border-radius:6px;background:var(--todo-soft);color:var(--muted);white-space:nowrap}
.svc.q{background:var(--qloo-soft);color:var(--qloo)}

/* three panes */
.panes{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:18px;align-items:start}
.rail{position:sticky;top:76px;display:grid;gap:12px}
.rail h4{margin:6px 0 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rail button{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 9px;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.rail button:hover{background:var(--panel);border-color:var(--line)}
.rail button[aria-current="step"]{background:var(--panel);border-color:var(--accent)}
.rail .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;border:1px solid var(--line-strong);color:var(--ink);background:var(--paper)}
.rail .n.push{border-color:var(--push);color:var(--push)}
.rail .t{font-size:13px;color:var(--ink);line-height:1.3}
.rail .m{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}

.stage{background:var(--stage);border-radius:18px;padding:18px;display:grid;gap:12px;min-width:0}
.stagehead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.stagehead h2{font-size:22px}
.stagehead .sub{font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:13px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.hood{position:sticky;top:76px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px;min-width:0}
.hood h3{font-size:18px}
.hood .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.hood ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hood li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;align-items:baseline;font-size:13px}
.hood li .what{min-width:0}
.hood li .cnt{grid-column:2;font-size:11.5px;color:var(--muted)}
.hood li code{display:block;font-size:11px;color:var(--qloo);overflow-wrap:anywhere}
.hood .where{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.hood .nextup{font-size:13px;border-top:1px dashed var(--line);padding-top:10px}
.hood .nextup b{color:var(--accent-text)}

/* other views */
.view{display:grid;gap:16px;max-width:1000px}
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.now>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.now b{font-family:var(--display);font-weight:500;font-size:20px;color:var(--ink)}
.now span:last-child{color:var(--muted);font-size:13px}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.unused{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.unused>div{border:1px dashed var(--line-strong);border-radius:12px;padding:12px 14px;display:grid;gap:4px;min-width:0;font-size:13px;color:var(--muted)}
.unused code{color:var(--ink)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* ---------- product screens (fixed light look) ---------- */
.frame{background:var(--s-paper);border:1px solid #d8d1c4;border-radius:14px;overflow:hidden;color:var(--s-text);font-size:12.5px;line-height:1.45}
.frame .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#efeae1;border-bottom:1px solid #ddd6c8}
.frame .dots{display:flex;gap:5px}
.frame .dots i{width:9px;height:9px;border-radius:50%;background:#d3cbbc;display:block}
.frame .url{flex:1;min-width:0;background:#fff;border-radius:6px;padding:3px 10px;font-family:var(--mono);font-size:11px;color:#6b655b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr{padding:16px 18px 20px;display:grid;gap:12px;min-height:420px}
.s-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--s-line);padding-bottom:10px}
.s-logo{font-family:var(--display);font-size:16px;color:var(--s-ink)}
.s-logo small{display:block;font-family:var(--body);font-size:8.5px;letter-spacing:.14em;color:var(--s-muted);text-transform:uppercase}
.s-links{display:flex;gap:12px;font-size:11.5px;color:var(--s-ink);align-items:center}
.s-links .q{border:1px solid var(--s-line2);border-radius:999px;padding:2px 8px;color:var(--s-muted);font-size:10.5px}
.s-eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--s-muted);font-weight:600}
.s-h1{font-family:var(--display);font-weight:500;color:var(--s-ink);font-size:28px;line-height:1.08;letter-spacing:-.02em}
.s-h1 em{color:var(--s-accent)}
.s-h2{font-family:var(--display);font-weight:500;color:var(--s-ink);font-size:20px;line-height:1.15}
.s-sub{color:var(--s-muted);font-size:11.5px}
.s-card{background:var(--s-panel);border:1px solid var(--s-line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.s-card.hl{border-color:var(--s-accent)}
.s-flat{background:var(--s-panel2);border:1px solid var(--s-line);border-radius:10px;padding:8px 10px;min-width:0}
.s-grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.s-btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;font-weight:600;font-size:12px;border:1px solid transparent;background:var(--s-ink);color:#fff}
.s-btn.accent{background:var(--s-accent)}
.s-btn.ghost{background:transparent;color:var(--s-ink);border-color:var(--s-line2)}
.s-link{color:var(--s-accent);font-weight:600;font-size:12px;background:none;border:0;padding:0}
.s-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:10.5px;background:var(--s-panel2);border:1px solid var(--s-line);color:var(--s-text);white-space:nowrap}
.s-chip.ok{background:var(--s-ok-soft);color:var(--s-ok);border-color:transparent}
.s-chip.warn{background:var(--s-warn-soft);color:var(--s-warn);border-color:transparent}
.s-chip.acc{background:var(--s-accent-soft);color:var(--s-accent);border-color:transparent}
.s-chips{display:flex;flex-wrap:wrap;gap:4px}
.s-field{border:1px solid var(--s-line2);border-radius:8px;padding:6px 9px;background:#fff;color:var(--s-ink);font-size:12px;min-width:0}
.s-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--s-muted);font-weight:600;margin-bottom:3px}
.s-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.s-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--s-accent)}
.s-ring{--p:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--s-accent) calc(var(--p)*1%),var(--s-line) 0);flex:none}
.s-ring span{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--s-ink)}
.s-ev{display:flex;justify-content:space-between;gap:10px}
.s-bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:58px}
.s-bars div{border-radius:3px 3px 0 0}
.s-ages{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center;font-size:10px;color:var(--s-muted)}
.s-ages b{display:block;color:var(--s-ink);font-weight:600}
.s-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.s-tbl td{border-top:1px solid var(--s-line);padding:5px 4px}
.s-chalk{background:#2b2d2a;color:#f3efe7;border-radius:8px;padding:10px 12px;font-family:var(--display);font-size:14px;line-height:1.3;white-space:pre-line}
.tag-target{justify-self:start;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--s-warn);background:var(--s-warn-soft);border-radius:6px;padding:2px 8px}
.phone{width:min(300px,100%);margin:0 auto;border:9px solid #1d1b16;border-radius:30px;background:#e9e3d8;overflow:hidden;font-size:12px;color:#17150f}
.phone .ph-top{background:#0f6e56;color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center}
.phone .av{width:28px;height:28px;border-radius:50%;background:#f7f4ee;color:#0f6e56;display:grid;place-items:center;font-family:var(--display);font-size:14px;font-weight:500}
.phone .ph-body{padding:14px 10px 18px;display:grid;gap:8px;min-height:300px;align-content:start}
.bubble{background:#fff;border-radius:4px 12px 12px 12px;padding:9px 11px;max-width:92%;box-shadow:0 1px 0 rgba(0,0,0,.06);line-height:1.45}
.bubble .time{display:block;text-align:right;font-size:10px;color:#8a847a;margin-top:4px}
.ph-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ph-actions button{border:0;border-radius:8px;background:#fff;color:#0f6e56;font-weight:600;padding:8px;font-size:12px}
.map{width:100%;height:auto;display:block;border-radius:10px;background:#efeae1}
[data-next].hot{box-shadow:0 0 0 3px rgba(180,83,10,.28);position:relative}
@media (prefers-reduced-motion: no-preference){
  [data-next].hot{animation:hot 1.6s ease-in-out infinite}
  @keyframes hot{0%,100%{box-shadow:0 0 0 2px rgba(180,83,10,.25)}50%{box-shadow:0 0 0 6px rgba(180,83,10,.12)}}
}


/* real screenshots */
.scr.shotwrap{padding:0;min-height:0;display:block}
.shot{max-height:min(72vh,700px);overflow:auto;background:#f7f4ee}
.shot img{display:block;width:100%;height:auto}
.shotbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid #e4ded3;background:#fbf9f5}
.shotnote{font-size:11.5px;color:#6b655b}
.app.present .shot{max-height:calc(100vh - 230px)}
/* presentation mode */
.app.present .intro,.app.present .rail,.app.present .disc{display:none}
.app.present .panes{grid-template-columns:minmax(0,1fr) 300px}
.app.present + footer,.app.present footer{display:none}
.disc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}
.disc b{font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink);grid-column:1/-1}
/* radar screen: brand-guide map + timeline */
.s-tl{position:relative;height:96px;border:1px solid var(--s-line);border-radius:10px;background:#fff;overflow:hidden}
.s-tl .day{position:absolute;top:0;bottom:0;border-left:1px solid var(--s-line2)}
.s-tl .day.alt{background:#fbf9f5}
.s-tl .day b{position:absolute;top:5px;left:6px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--s-muted);font-weight:600;white-space:nowrap}
.s-tl .tick{position:absolute;bottom:3px;transform:translateX(-50%);font-size:9px;color:#a39c8f;font-variant-numeric:tabular-nums}
.s-tl .bar{position:absolute;height:20px;border-radius:6px;border:1px solid #d9d2c5;background:#efebe3;color:#4a463e;font-size:10px;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden}
.s-tl .bar.hot{background:#fbe9d9;border-color:#e0955a;color:#7f3a06;font-weight:600}
.s-tl .bar.sel{outline:2px solid #17150f;outline-offset:1px}
.s-tl .bar i{position:absolute;top:3px;bottom:3px;border-radius:3px;background:rgba(180,83,10,.22)}
.s-tl .bar.cold i{background:rgba(23,21,15,.08)}
.s-tl .bar span{position:relative}
.s-tl .now{position:absolute;top:0;bottom:0;border-left:1.5px dashed #6b655b}
.s-tl .now em{position:absolute;top:18px;left:3px;font-style:normal;font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b655b}
.s-tl .cur{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#17150f}
.s-tl .cur em{position:absolute;top:3px;left:5px;font-style:normal;font-size:9.5px;font-weight:600;color:#fff;background:#17150f;border-radius:5px;padding:0 5px;white-space:nowrap}
.s-mapbox{position:relative;border:1px solid var(--s-line);border-radius:14px;overflow:hidden;background:#efeae1}
.s-mapbox img{display:block;width:100%;height:auto}
.s-mapbox .rad{position:absolute;left:50%;top:50%;width:74.02%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px dashed #cfc7b8;border-radius:50%;pointer-events:none}
.s-mapbox .pt{position:absolute;width:0;height:0}
.s-mapbox .me{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#17150f;box-shadow:0 0 0 2px #f7f4ee,0 0 0 3px #cfc7b8}
.s-mapbox .hot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#b4530a;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #17150f}
.s-mapbox .cold{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#b8af9f;box-shadow:0 0 0 1.5px #fff}
.s-mapbox .idle{opacity:.38}
.s-mapbox .chip{position:absolute;left:11px;top:-11px;white-space:nowrap;background:#fff;border:1px solid #e4ded3;border-radius:7px;padding:1px 6px;font-size:10px;font-weight:600;color:#17150f;line-height:1.3}
.s-mapbox .chip small{display:block;font-weight:400;font-size:9px;color:#6b655b}
.s-mapbox .chip.sel{border-color:#17150f}
.s-mapbox .chip.muted{color:#6b655b;font-weight:500}
.s-mapbox .attr{position:absolute;right:4px;bottom:3px;font-size:8.5px;color:#6b655b;background:rgba(255,255,255,.8);padding:0 4px;border-radius:3px}
.s-mapbox .fs{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:600;background:#fff;border:1px solid #cfc7b8;border-radius:999px;padding:2px 8px;color:#17150f}

/* responsive */
@media (max-width:1180px){
  .panes{grid-template-columns:minmax(0,1fr) 300px}
  .rail{position:static;grid-column:1/-1}

${[["Harry Styles","Pre-show happy hour","HARRY16","example"],["New York Knicks","Game night big screen","KNICKS22","example"],["Weekday flow","Pre-show happy hour","AFTERWORK","example"]].map(r=>`<tr><td style="color:var(--s-ink);font-weight:600">${r[0]}</td><td>${r[1]}</td><td style="font-family:var(--mono)">${r[2]}</td><td style="text-align:right" class="s-sub">${r[3]}</td></tr>`).join("")}</table></div>

/* ---------- rendering ---------- */
function setLang(l){lang=l;try{localStorage.setItem("turnout-journey-lang",l)}catch(e){}document.documentElement.lang=l;render()}
function render(){
 const d=D(),u=d.ui;
 document.getElementById("docTitle").textContent=u.docTitle;
 document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
 document.getElementById("views").innerHTML=["journey","work","calls"].map(v=>`<button type="button" data-view="${v}" aria-pressed="${v===view}">${esc(u.views[v])}</button>`).join("");
 document.getElementById("foot").textContent=u.footer;
 const fsb=document.getElementById("fsbtn");fsb.textContent=document.querySelector(".app").classList.contains("present")?(u.exitFullscreen||"Exit full screen"):(u.fullscreen||"Full screen");
 const main=document.getElementById("main");
 if(view==="journey")main.innerHTML=journey(d);else if(view==="work")main.innerHTML=work(d);else main.innerHTML=calls(d);
 if(view==="journey"){main.querySelectorAll("[data-next]").forEach(b=>b.addEventListener("click",()=>go((cur+1)%META.length)));}
 main.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.step)));
}
function go(i){cur=i;try{history.replaceState(null,"","#s"+(i+1))}catch(e){}render();const st=document.getElementById("stage");if(st&&st.getBoundingClientRect().top<0)st.scrollIntoView({behavior:"smooth",block:"start"})}
function statusPill(s,u){return `<span class="pill ${s}">${esc(u.status[s])}</span>`}
function trigChip(t,u){return `<span class="trig ${t}">${esc(u.trig[t])}</span>`}
function journey(d){
 const u=d.ui,mt=META[cur],st=d.steps[mt.id]||{};
 const rail=`<nav class="rail" aria-label="${esc(u.views.journey)}"><div class="groups">${PHASES.map(p=>`<div><h4>${esc(u.phases[p])}</h4><ol>${META.map((x,i)=>x.phase!==p?"":`<li><button type="button" data-step="${i}" ${i===cur?'aria-current="step"':""}><span class="n ${x.trig}">${i+1}</span><span><span class="t">${esc((d.steps[x.id]||{}).title)}</span><span class="m">${trigChip(x.trig,u)}${statusPill(x.status,u)}</span></span></button></li>`).join("")}</ol></div>`).join("")}</div></nav>`;
 const inner=mt.shot?`<div class="shot"><img src="shots/${mt.shot}.jpg" alt="${esc(st.title)}, product screen" loading="eager"></div><div class="shotbar"><span class="shotnote">${esc(u.realShot||"")}</span><button class="s-btn accent hot" data-next>${esc(mt.cta)}</button></div>`:SCREENS[mt.screen]();
 const frame=mt.url?`<div class="frame"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">${esc(mt.url)}</span></div><div class="scr${mt.shot?" shotwrap":""}">${inner}</div></div>`:`<div style="display:grid;gap:10px;justify-items:center">${SCREENS[mt.screen]()}</div>`;
 const stage=`<section class="stage" id="stage" aria-live="polite"><div class="stagehead"><div><p class="sub">${esc(u.stepOf.replace("{n}",cur+1).replace("{total}",META.length))} · ${esc(u.phases[mt.phase])}</p><h2>${esc(st.title)}</h2></div><div style="display:flex;gap:6px;flex-wrap:wrap">${trigChip(mt.trig,u)}${statusPill(mt.status,u)}</div></div>${frame}<div class="nav"><button type="button" class="btn" data-step="${(cur+META.length-1)%META.length}">← ${esc(u.prev)}</button><span class="hint">${esc(u.hint)}</span><button type="button" class="btn primary" data-step="${(cur+1)%META.length}">${esc(u.next)} →</button></div>${u.screensNote?`<p class="hint">${esc(u.screensNote)}</p>`:""}</section>`;
 const callsList=mt.calls.length?`<ul>${mt.calls.map((c,i)=>{const t=(st.calls||[])[i]||{};return `<li><span class="svc${c.svc==="Qloo"?" q":""}">${esc(svcName(c.svc))}</span><span class="what">${esc(t.what)}${c.api&&c.svc==="Qloo"&&!/steps|cache/.test(c.api)?`<code>${esc(c.api)}</code>`:""}</span><span class="cnt">${esc(t.count)}</span></li>`}).join("")}</ul>`:`<p>${esc(u.noCalls)}</p>`;
 const hood=`<aside class="hood" aria-label="${esc(u.hood)}"><h3>${esc(u.hood)}</h3>
  <div><p class="k">${esc(u.trigger)}</p><p>${trigChip(mt.trig,u)} ${esc(st.who)}</p></div>
  <div><p class="k">${esc(u.sees)}</p><p>${esc(st.sees)}</p></div>
  <div><p class="k">${esc(u.calls)}</p>${callsList}</div>
  <div><p class="k">${esc(u.decides)}</p><p>${esc(st.decides)}</p></div>
  <div><p class="k">${esc(u.code)}</p><p class="where">${mt.code?`<code>${esc(mt.code)}</code>`:esc(st.codeNote||"")}</p></div>
  ${st.next?`<p class="nextup"><b>${esc(u.nextUp)}</b> · ${esc(st.next)}</p>`:""}
 </aside>`;
 const head=`<section class="intro"><h1>${esc(u.headline)}</h1><p>${esc(u.intro)}</p><div class="legend"><span>${trigChip("pull",u)} ${esc(u.legend.pull)}</span><span>${trigChip("push",u)} ${esc(u.legend.push)}</span>${["done","wip","todo"].map(s=>`<span>${statusPill(s,u)}</span>`).join("")}<span><span class="svc q">Qloo</span> ${esc(u.legend.qloo)}</span></div></section>`;
 const disc=u.discovery?`<section class="disc"><b>${esc(u.discovery.title)}</b>${trigChip("pull",u)}<span>${esc(u.discovery.today)}</span>${trigChip("push",u)}<span>${esc(u.discovery.target)}</span></section>`:"";
 return `<div style="display:grid;gap:18px;padding-top:18px">${head}${disc}<div class="panes">${rail}${stage}${hood}</div></div>`;
}
function work(d){
 const u=d.ui,w=u.work;
 return `<section class="view" style="padding-top:18px"><div class="intro"><h1>${esc(w.title)}</h1><p>${esc(w.intro)}</p></div>
 <div class="now">${u.now.map(n=>`<div><span class="pill todo" style="justify-self:start">${esc(n.k)}</span><b>${esc(n.v)}</b><span>${esc(n.d)}</span></div>`).join("")}</div>
 <div class="tablebox"><table><thead><tr>${w.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${w.rows.map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.who)}</td><td><span class="pill ${r.status}">${esc(r.label||u.status[r.status])}</span></td><td>${r.steps.map(s=>`<button type="button" class="btn" style="padding:2px 9px;font-size:12px" data-gostep="${s}">${s}</button>`).join(" ")}</td></tr>`).join("")}</tbody></table></div></section>`;
}
function calls(d){
 const u=d.ui,b=u.budget;
 return `<section class="view" style="padding-top:18px"><div class="intro"><h1>${esc(b.title)}</h1><p>${esc(b.intro)}</p></div>
 <div class="tablebox"><table><thead><tr>${b.cols.map((c,i)=>`<th${i?' style="text-align:right"':""}>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr><td>${esc(r[0])}</td>${r.slice(1).map(x=>`<td class="n">${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
 <p style="color:var(--muted)">${esc(b.note)}</p>
 <h2 style="font-size:20px">${esc(b.unusedTitle)}</h2>
 <div class="unused">${b.unused.map(x=>`<div><code>${esc(x[0])}</code><span>${esc(x[1])}</span></div>`).join("")}</div></section>`;
}
document.getElementById("langs").addEventListener("click",e=>{const b=e.target.closest("button[data-lang]");if(b)setLang(b.dataset.lang)});
document.getElementById("views").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b){view=b.dataset.view;render()}});
document.getElementById("main").addEventListener("click",e=>{const b=e.target.closest("[data-gostep]");if(b){view="journey";const n=+b.dataset.gostep;cur=isNaN(n)?0:n-1;render()}});
document.addEventListener("keydown",e=>{if(view!=="journey"||e.target.closest("input,textarea,select"))return;if(e.key==="ArrowRight")go((cur+1)%META.length);if(e.key==="ArrowLeft")go((cur+META.length-1)%META.length)});
async function toggleFs(){const app=document.querySelector(".app");const on=!app.classList.contains("present");app.classList.toggle("present",on);view="journey";try{if(on&&!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(!on&&document.fullscreenElement)await document.exitFullscreen()}catch(e){}render()}
document.getElementById("fsbtn").addEventListener("click",toggleFs);
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.querySelector(".app").classList.contains("present")){document.querySelector(".app").classList.remove("present");render()}});
window.addEventListener("hashchange",()=>{const h=location.hash;if(h==="#fr"||h==="#en"){setLang(h.slice(1));return}const mm=h.match(/^#s(\d+)$/);if(mm){const i=+mm[1]-1;if(i>=0&&i<META.length&&i!==cur){view="journey";cur=i;render()}}});
document.documentElement.lang=lang;
render();
</script>
